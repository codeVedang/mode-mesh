name: Mission checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/missions-checks.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/missions-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/services/agent/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend/services/agent
      - run: npm test
        working-directory: backend/services/agent
      - run: npm ci
        working-directory: frontend
      - run: npx eslint src/components/MissionRoom.jsx src/components/ModeGateway.jsx src/components/VoiceRoom.jsx src/components/SideBar.jsx src/pages/Home.jsx
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
